name: Live page verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the published game
        run: node tests/live-page.cjs
      - name: Verify battlefield photos, geography and archived results
        run: WAR_BROWSER_OUTPUT=docs/qa/live/war/report.json node tests/browser-war.cjs https://chillchill0027.github.io/road-to-56-soviet/
      - name: Replay every route on the published page
        run: ROUTE_BROWSER_OUTPUT=docs/qa/live/browser-routes.json node tests/browser-routes.cjs https://chillchill0027.github.io/road-to-56-soviet/
      - name: Verify dialogue and automatic policy formation on the published page
        run: NOVEL_BROWSER_OUTPUT=docs/qa/live/novel-browser.json node tests/browser-novel.cjs https://chillchill0027.github.io/road-to-56-soviet/
      - name: Verify news, opening and source archive on the published page
        run: IMMERSION_OUTPUT=docs/qa/live/immersion/report.json node tests/browser-immersion.cjs https://chillchill0027.github.io/road-to-56-soviet/
      - name: Verify statistics and annual reviews on the published page
        run: STATISTICS_OUTPUT=docs/qa/live/statistics/report.json node tests/browser-statistics.cjs https://chillchill0027.github.io/road-to-56-soviet/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-page-verification
          path: docs/qa/live/

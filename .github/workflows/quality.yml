name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:scene-art
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:novel
      - run: npm run test:browser:immersion
      - run: npm run test:browser:statistics
      - run: npm run test:browser:war
      - run: npm run test:browser:endings
      - run: npm run test:browser:scene-art
      - run: npm run test:browser:routes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: |
            docs/qa/browser-smoke.json
            docs/qa/browser-routes.json
            docs/qa/route-coverage.json
            docs/qa/all-endings-gallery.png
            docs/qa/successor-*.png
            docs/qa/decision-*.png
            docs/qa/battle-costs.png
            docs/qa/novel-*.png
            docs/qa/novel-browser.json
            docs/qa/immersion/
            docs/qa/statistics/
            docs/qa/war/
            docs/qa/endings/
            docs/qa/scene-art/
